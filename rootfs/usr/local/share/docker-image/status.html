<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>运行状态</title>
  <style>
    :root { color: #202522; background: #f4f6f3; font-family: system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; letter-spacing: 0; }
    body { min-height: 100vh; margin: 0; }
    a { color: inherit; text-decoration: none; }
    .topbar { min-height: 58px; border-bottom: 1px solid #303632; color: #f7faf7; background: #1c211e; }
    .topbar-inner { width: min(100% - 32px, 1120px); min-height: 58px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 750; }
    .brand-mark { display: grid; width: 30px; height: 30px; place-items: center; border: 1px solid #657069; border-radius: 6px; color: #66d4ae; font-family: ui-monospace, monospace; font-size: 13px; }
    nav { display: flex; align-items: center; gap: 18px; color: #bcc5bf; font-size: 13px; }
    nav a:hover, nav a:focus-visible { color: #ffffff; outline: none; }
    main { width: min(100% - 32px, 1120px); margin: 0 auto; padding: 30px 0 48px; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
    .eyebrow { margin: 0 0 7px; color: #27795f; font-size: 12px; font-weight: 750; text-transform: uppercase; }
    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: 0; font-size: 30px; line-height: 1.2; }
    h2 { margin-bottom: 0; font-size: 16px; }
    .live { display: inline-flex; min-height: 30px; align-items: center; gap: 8px; color: #526059; font-size: 13px; }
    .live::before { width: 8px; height: 8px; border-radius: 50%; background: #22a06b; content: ''; box-shadow: 0 0 0 4px #dff3e9; }
    .live.stale::before { background: #d19528; box-shadow: 0 0 0 4px #faefd7; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
    .metric { min-height: 92px; padding: 16px; border: 1px solid #d2d9d4; border-radius: 8px; background: #ffffff; }
    .metric-label { display: block; margin-bottom: 12px; color: #68736d; font-size: 12px; }
    .metric-value { display: block; color: #1f2722; font: 750 22px ui-monospace, monospace; overflow-wrap: anywhere; }
    .metric-note { display: block; margin-top: 5px; color: #7a847e; font-size: 11px; }
    .layout { display: grid; grid-template-columns: minmax(280px, .75fr) minmax(0, 1.25fr); gap: 18px; align-items: start; }
    .panel { border: 1px solid #d2d9d4; border-radius: 8px; background: #ffffff; overflow: hidden; }
    .panel-heading { min-height: 52px; padding: 0 16px; border-bottom: 1px solid #e4e8e5; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .panel-meta { color: #7a847e; font: 12px ui-monospace, monospace; }
    .components { padding: 4px 16px; }
    .component { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid #edf0ee; }
    .component:last-child { border-bottom: 0; }
    .component-name { color: #3d4741; font-size: 13px; }
    .badge { display: inline-flex; min-width: 76px; min-height: 25px; align-items: center; justify-content: center; gap: 7px; padding: 3px 8px; border: 1px solid #cfd6d1; border-radius: 5px; color: #69736d; background: #f7f8f7; font: 750 11px ui-monospace, monospace; text-transform: uppercase; }
    .badge::before { width: 7px; height: 7px; border-radius: 50%; background: #929c96; content: ''; }
    .badge-up { border-color: #b8d8ca; color: #176446; background: #eff8f4; }
    .badge-up::before { background: #22a06b; }
    .badge-down { border-color: #e2bbb7; color: #9d342f; background: #fff4f2; }
    .badge-down::before { background: #d55248; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { padding: 12px 14px; border-bottom: 1px solid #edf0ee; text-align: left; vertical-align: middle; }
    th { color: #727d76; background: #fafbfa; font-size: 11px; font-weight: 750; text-transform: uppercase; }
    td { color: #3b453f; font-size: 13px; overflow-wrap: anywhere; }
    tbody tr:last-child td { border-bottom: 0; }
    .route-name { font-weight: 700; }
    .mono { color: #68736d; font-family: ui-monospace, monospace; font-size: 12px; }
    .empty { margin: 0; padding: 18px; color: #717b75; font-size: 13px; }
    @media (max-width: 820px) { .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } .layout { grid-template-columns: 1fr; } }
    @media (max-width: 520px) { .topbar-inner, main { width: min(100% - 24px, 1120px); } nav { gap: 12px; } nav a:first-child { display: none; } main { padding-top: 22px; } header { align-items: flex-start; flex-direction: column; gap: 12px; } .metrics { grid-template-columns: 1fr; } .metric { min-height: 78px; } th:nth-child(3), td:nth-child(3) { display: none; } }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/services/"><span class="brand-mark">D/</span><span>Docker Image</span></a>
      <nav aria-label="主导航"><a href="/">工作区</a><a href="/dns/">DNS</a><a href="/manage/">证书</a></nav>
    </div>
  </div>
  <main>
    <header>
      <div><p class="eyebrow">Runtime monitor</p><h1>运行状态</h1></div>
      <span id="live" class="live">正在同步</span>
    </header>
    <section class="metrics" aria-label="运行指标">
      <article class="metric"><span class="metric-label">工作区</span><strong id="workspace" class="metric-value">--</strong><span class="metric-note">磁盘使用率</span></article>
      <article class="metric"><span class="metric-label">内存</span><strong id="memory" class="metric-value">--</strong><span id="memory-note" class="metric-note">--</span></article>
      <article class="metric"><span class="metric-label">负载</span><strong id="load" class="metric-value">--</strong><span class="metric-note">1 / 5 / 15 分钟</span></article>
      <article class="metric"><span class="metric-label">运行时间</span><strong id="uptime" class="metric-value">--</strong><span id="hostname" class="metric-note">--</span></article>
    </section>
    <div class="layout">
      <section class="panel" aria-labelledby="components-title">
        <div class="panel-heading"><h2 id="components-title">组件</h2><span id="component-summary" class="panel-meta">--</span></div>
        <div id="components" class="components"></div>
      </section>
      <section class="panel" aria-labelledby="routes-title">
        <div class="panel-heading"><h2 id="routes-title">服务路由</h2><span id="mounts" class="panel-meta">--</span></div>
        <div id="routes" class="table-wrap"></div>
      </section>
    </div>
  </main>
  <script>
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    const componentLabels = { ssh: 'SSH', code_server: 'code-server', nginx: 'Nginx', dockerd: 'Rootless DIND', tailscale: 'Tailscale' };
    const stateLabel = (value) => value === 'up' ? 'online' : value === 'down' ? 'offline' : value;
    const stateClass = (value) => value === 'up' ? 'badge-up' : value === 'down' ? 'badge-down' : '';

    function formatBytes(value) {
      if (!Number.isFinite(Number(value))) return '--';
      const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB'];
      let size = Number(value); let unit = 0;
      while (size >= 1024 && unit < units.length - 1) { size /= 1024; unit += 1; }
      return `${size >= 10 || unit === 0 ? size.toFixed(0) : size.toFixed(1)} ${units[unit]}`;
    }

    function formatUptime(seconds) {
      const total = Math.max(0, Number(seconds) || 0);
      const days = Math.floor(total / 86400);
      const hours = Math.floor((total % 86400) / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      return days ? `${days}d ${hours}h` : hours ? `${hours}h ${minutes}m` : `${minutes}m`;
    }

    function render(data) {
      document.getElementById('workspace').textContent = data.workspace_usage || '--';
      document.getElementById('memory').textContent = Number.isFinite(data.memory_usage_percent) ? `${data.memory_usage_percent}%` : '--';
      document.getElementById('memory-note').textContent = `${formatBytes(data.memory_used_bytes)} / ${formatBytes(data.memory_total_bytes)}`;
      document.getElementById('load').textContent = (data.load_average || []).join(' / ') || '--';
      document.getElementById('uptime').textContent = formatUptime(data.uptime_seconds);
      document.getElementById('hostname').textContent = data.hostname || '--';
      document.getElementById('mounts').textContent = `SSHFS ${Number(data.sshfs_mounts) || 0}`;

      const components = Object.entries(data.components || {});
      const online = components.filter(([, value]) => value === 'up').length;
      document.getElementById('component-summary').textContent = `${online}/${components.length} online`;
      document.getElementById('components').innerHTML = components.map(([name, value]) => `
        <div class="component"><span class="component-name">${escapeHtml(componentLabels[name] || name)}</span><span class="badge ${stateClass(value)}">${escapeHtml(stateLabel(value))}</span></div>
      `).join('');

      const services = data.services || [];
      document.getElementById('routes').innerHTML = services.length ? `<table><thead><tr><th style="width:26%">服务</th><th style="width:19%">状态</th><th style="width:20%">路径</th><th>上游</th></tr></thead><tbody>${services.map((service) => `
        <tr><td class="route-name">${escapeHtml(service.name)}</td><td><span class="badge ${stateClass(service.state)}">${escapeHtml(stateLabel(service.state))}</span></td><td class="mono">${escapeHtml(service.path)}</td><td class="mono">${escapeHtml(service.endpoint)}</td></tr>
      `).join('')}</tbody></table>` : '<p class="empty">暂无服务路由</p>';

      const generated = data.generated_at ? new Date(data.generated_at) : null;
      const age = generated ? Date.now() - generated.getTime() : Infinity;
      const live = document.getElementById('live');
      live.textContent = generated ? `更新于 ${generated.toLocaleTimeString()}` : '等待数据';
      live.className = `live${age > 15000 ? ' stale' : ''}`;
    }

    async function refresh() {
      try {
        const response = await fetch(`/status.json?ts=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        render(await response.json());
      } catch (error) {
        const live = document.getElementById('live');
        live.textContent = `同步失败 · ${error.message}`;
        live.className = 'live stale';
      }
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
